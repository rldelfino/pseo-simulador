name: Saúde semanal do site

on:
  schedule:
    # segunda-feira, 12:00 UTC (depois da atualização semanal do projeto de veículos)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Verificar o site em produção
        run: >
          python verifica_saude.py
          --dominio https://simulador.datalabglobal.com
          --min-urls 250 --max-urls 900
          --chave-indexnow ebff622dbeb318e86594e1defc4d2270
          --paginas /,/comparador-bancos,/metodologia,/dados-abertos,/incorporar,/imprensa,/taxas-financiamento-imobiliario,/renda-para-financiar-imovel
