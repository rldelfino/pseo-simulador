name: ETL Mensal de Taxas de Juros e Rebuild do Site

on:
  schedule:
    - cron: '0 8 1 * *' # Roda todo dia 1º do mês às 08:00
  workflow_dispatch: # Permite rodar manualmente no GitHub

# ISSO AQUI RESOLVE O ERRO 128 (Dá permissão de gravação pro robô)
permissions:
  contents: write

jobs:
  atualiza-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências Python
        run: pip install -r requirements.txt

      - name: Rodar Extrator (atualiza dados.csv com taxas/LTV/prazo)
        run: python etl_taxas.py

      - name: Regerar as páginas pSEO (gerador.py)
        run: python gerador.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Tailwind CLI
        run: npm install

      - name: Compilar CSS estático (substitui o CDN do Tailwind em produção)
        run: npm run build:css

      - name: Atualizar Site (Commit e Push)
        run: |
          git config --global user.name "Robô Datalab"
          git config --global user.email "bot@datalabglobal.com"
          # taxas_cache.json e relatorio_atualizacao_taxas.txt PRECISAM ser
          # commitados: o cache é o que permite ao próximo mês "lembrar" a
          # última taxa confirmada de cada banco quando uma fonte falhar
          # (regra pedida pelo Rodolfo). Sem commitar, cada execução do
          # Actions parte de um checkout limpo e o cache nasce vazio de
          # novo — a regra de fallback nunca funcionaria de verdade.
          git add dados.csv paginas_seo taxas_cache.json relatorio_atualizacao_taxas.txt
          git commit -m "auto: atualização mensal de taxas e rebuild do site" || echo "Sem mudanças"
          git push
