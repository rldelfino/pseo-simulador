<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Financiamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border border-slate-200">
        <h1 class="text-2xl font-extrabold mb-6 text-center text-slate-800">Simulador Imobiliário</h1>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700">Valor do Imóvel (R$)</label>
                <input type="number" id="valor_imovel" value="300000" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border bg-slate-50 text-slate-900">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700">Entrada (R$)</label>
                <input type="number" id="entrada" value="60000" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border bg-slate-50 text-slate-900">
            </div>
            
            <div class="flex space-x-4">
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-slate-700">Juros (% a.m.)</label>
                    <input type="number" id="taxa" value="0.8" step="0.01" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border bg-slate-50 text-slate-900">
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-slate-700">Prazo (meses)</label>
                    <input type="number" id="prazo" value="360" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border bg-slate-50 text-slate-900">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Sistema de Amortização</label>
                <div class="flex space-x-6 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="sistema" value="SAC" checked class="form-radio text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 font-medium text-slate-700">SAC</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="sistema" value="PRICE" class="form-radio text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 font-medium text-slate-700">PRICE</span>
                    </label>
                </div>
            </div>

            <button id="btn_calcular" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
                Calcular Financiamento
            </button>
        </div>

        <div id="resultados" class="mt-8 p-5 bg-indigo-50 rounded-xl border border-indigo-100 hidden">
            <h2 class="text-lg font-extrabold text-indigo-900 mb-4 text-center">Resultados da Simulação</h2>
            <div class="space-y-3">
                <div class="flex justify-between items-center border-b border-indigo-200 pb-2">
                    <span class="text-indigo-800 font-medium">Primeira Parcela:</span>
                    <span id="res_primeira" class="font-bold text-slate-900">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center border-b border-indigo-200 pb-2">
                    <span class="text-indigo-800 font-medium">Última Parcela:</span>
                    <span id="res_ultima" class="font-bold text-slate-900">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-indigo-800 font-medium">Total de Juros:</span>
                    <span id="res_juros" class="font-extrabold text-rose-600">R$ 0,00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btn_calcular').addEventListener('click', function() {
            // 1. Captura de inputs
            const valorImovel = parseFloat(document.getElementById('valor_imovel').value);
            const entrada = parseFloat(document.getElementById('entrada').value);
            const taxa = parseFloat(document.getElementById('taxa').value) / 100;
            const prazo = parseInt(document.getElementById('prazo').value);
            const sistema = document.querySelector('input[name="sistema"]:checked').value;
            
            const valorFinanciado = valorImovel - entrada;
            
            if (valorFinanciado <= 0) {
                alert("A entrada não pode ser maior ou igual ao valor do imóvel.");
                return;
            }

            let primeiraParcela = 0;
            let ultimaParcela = 0;
            let totalJuros = 0;

            // 2. Lógica SAC e PRICE
            if (sistema === 'SAC') {
                const amortizacao = valorFinanciado / prazo;
                primeiraParcela = amortizacao + (valorFinanciado * taxa);
                ultimaParcela = amortizacao + (amortizacao * taxa); 
                
                const juros1 = valorFinanciado * taxa;
                const jurosN = amortizacao * taxa;
                totalJuros = ((juros1 + jurosN) * prazo) / 2;

            } else if (sistema === 'PRICE') {
                const parcela = valorFinanciado * (taxa * Math.pow(1 + taxa, prazo)) / (Math.pow(1 + taxa, prazo) - 1);
                primeiraParcela = parcela;
                ultimaParcela = parcela;
                totalJuros = (parcela * prazo) - valorFinanciado;
            }

            // 3. Atualização de Tela
            const configBRL = { style: 'currency', currency: 'BRL' };
            document.getElementById('res_primeira').innerText = primeiraParcela.toLocaleString('pt-BR', configBRL);
            document.getElementById('res_ultima').innerText = ultimaParcela.toLocaleString('pt-BR', configBRL);
            document.getElementById('res_juros').innerText = totalJuros.toLocaleString('pt-BR', configBRL);
            
            document.getElementById('resultados').classList.remove('hidden');
        });
    </script>
</body>
</html>
